[package]
name = "iii-bridge"
version = "0.1.0"
edition = "2021"

[lib]
# Hyphen -> underscore: produces libiii_bridge.{dylib,so}/iii_bridge.dll
name = "iii_bridge"
crate-type = ["cdylib"]

[dependencies]
godot = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
iii-sdk = "0.19"
serde_json = "1"
