version: '3'

vars:
  ROOT_DIR:
    sh: pwd
  GODOT: '{{.GODOT | default "/Users/apprenticegc/Work/lunar-horse/tools/Godot_mono.app/Contents/MacOS/Godot"}}'
  SOLUTION: 'project/FantaSim.sln'
  GODOT_PROJECT: 'project/hosts/complete-app'
  CONTENT_PROJECT: 'project/hosts/content-app'
  BUILD_DIR: 'build'
  ASSEMBLY: 'complete-app'
  UNIFY: 'dotnet tool run unify-build --'
  GITVERSION_MAJORMINORPATCH:
    sh: |
      if [ -n "${GITVERSION_MAJORMINORPATCH:-}" ]; then
        printf '%s\n' "$GITVERSION_MAJORMINORPATCH"
      elif dotnet tool run dotnet-gitversion /output json 2>/dev/null | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("MajorMinorPatch","0.1.0"))' 2>/dev/null; then
        :
      else
        python3 -c 'import json,pathlib; p=pathlib.Path("build/build.config.json"); print(json.load(p.open(encoding="utf-8")).get("artifactsVersion","0.1.0") if p.exists() else "0.1.0")'
      fi

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  restore:
    desc: Restore dotnet tools
    cmds:
      - dotnet tool restore

  build:
    desc: Build the multi-project solution
    deps: [restore]
    cmds:
      - dotnet build {{.SOLUTION}}

  test:
    desc: Run all xUnit tests
    deps: [build]
    cmds:
      - dotnet test {{.SOLUTION}} --no-build

  format:
    desc: Run dotnet format on the solution
    deps: [restore]
    cmds:
      - dotnet format {{.SOLUTION}}

  run:
    desc: Run the Godot complete-app project (editor)
    cmds:
      - '{{.GODOT}} --path {{.GODOT_PROJECT}}'

  run:headless:
    desc: Run the Godot complete-app project headless
    cmds:
      - '{{.GODOT}} --headless --path {{.GODOT_PROJECT}}'

  version:
    desc: Print the GitVersion-derived MajorMinorPatch used for artifacts
    cmds:
      - echo "{{.GITVERSION_MAJORMINORPATCH}}"

  version:full:
    desc: Print full GitVersion JSON output
    cmds:
      - dotnet tool run dotnet-gitversion /output json

  build:godot:
    desc: Export the Godot app for all configured platforms via UnifyBuild
    deps: [restore, build, artifacts:latest]
    cmds:
      - '{{.UNIFY}} BuildGodot'
    env:
      GITVERSION_MAJORMINORPATCH: '{{.GITVERSION_MAJORMINORPATCH}}'

  build:godot:desktop:
    desc: Export the Godot app for desktop platforms only via UnifyBuild
    deps: [restore, build, artifacts:latest]
    cmds:
      - '{{.UNIFY}} BuildGodotDesktop'
    env:
      GITVERSION_MAJORMINORPATCH: '{{.GITVERSION_MAJORMINORPATCH}}'

  bundle:link:
    desc: Link content-app/bundles -> project/bundles
    run: once  # depended on by every bundle:* task; run a single time per invocation (no concurrent race)
    cmds:
      - ln -sfn ../../bundles {{.CONTENT_PROJECT}}/bundles  # idempotent: -f replace, -n don't deref existing symlink

  artifacts:latest:
    desc: Repoint build/_artifacts/latest at the current GitVersion build dir
    run: once  # depended on by every artifact-producing task; one idempotent symlink update per invocation
    cmds:
      - mkdir -p {{.BUILD_DIR}}/_artifacts/{{.GITVERSION_MAJORMINORPATCH}}
      # relative target (just the version dir name) so latest survives _artifacts being moved/copied
      - ln -sfn {{.GITVERSION_MAJORMINORPATCH}} {{.BUILD_DIR}}/_artifacts/latest  # -f replace, -n don't deref existing symlink

  bundle:stage:build:
    desc: Build the App.Stage tier assembly and stage its DLL into the bundle source dir
    cmds:
      - dotnet build project/plugins/App.Stage/App.Stage.csproj -c Debug -v q -nologo
      - cp project/plugins/App.Stage/bin/Debug/net8.0/FantaSim.App.Stage.dll project/bundles/stage/FantaSim.App.Stage.dll

  bundle:stage:
    desc: Build the stage tier DLL + export the collectible stage bundle PCK (manifest + scene + dll)
    deps: [bundle:link, bundle:stage:build, artifacts:latest]
    cmds:
      - mkdir -p {{.BUILD_DIR}}/_artifacts/{{.GITVERSION_MAJORMINORPATCH}}/godot/bundles
      - '{{.GODOT}} --headless --path {{.CONTENT_PROJECT}} --export-pack "stage PCK" {{.ROOT_DIR}}/{{.BUILD_DIR}}/_artifacts/{{.GITVERSION_MAJORMINORPATCH}}/godot/bundles/stage.pck'

  bundle:assist:build:
    desc: Build the App.Assist tier assembly and stage its DLL into the bundle source dir
    cmds:
      - dotnet build project/plugins/App.Assist/App.Assist.csproj -c Debug -v q -nologo
      - cp project/plugins/App.Assist/bin/Debug/net8.0/FantaSim.App.Assist.dll project/bundles/assist/FantaSim.App.Assist.dll

  bundle:assist:
    desc: Build the assist tier DLL + export the collectible assist bundle PCK (manifest + dll, no scene)
    deps: [bundle:link, bundle:assist:build, artifacts:latest]
    cmds:
      - mkdir -p {{.BUILD_DIR}}/_artifacts/{{.GITVERSION_MAJORMINORPATCH}}/godot/bundles
      - '{{.GODOT}} --headless --path {{.CONTENT_PROJECT}} --export-pack "assist PCK" {{.ROOT_DIR}}/{{.BUILD_DIR}}/_artifacts/{{.GITVERSION_MAJORMINORPATCH}}/godot/bundles/assist.pck'

  bundle:timeline:build:
    desc: Build the App.Timeline scene-tier assembly and stage its DLL into the bundle source dir
    cmds:
      - dotnet build project/plugins/App.Timeline/App.Timeline.csproj -c Debug -v q -nologo
      # App.Timeline is a Godot.NET.Sdk project: its DLL lands in .godot/mono/temp/bin (not bin/Debug/net8.0).
      - cp project/plugins/App.Timeline/.godot/mono/temp/bin/Debug/FantaSim.App.Timeline.dll project/bundles/timeline/FantaSim.App.Timeline.dll

  bundle:timeline:
    desc: Build the timeline hud-view DLL + export the collectible timeline bundle PCK (manifest + dll, no scene)
    deps: [bundle:link, bundle:timeline:build, artifacts:latest]
    cmds:
      - mkdir -p {{.BUILD_DIR}}/_artifacts/{{.GITVERSION_MAJORMINORPATCH}}/godot/bundles
      - '{{.GODOT}} --headless --path {{.CONTENT_PROJECT}} --export-pack "timeline PCK" {{.ROOT_DIR}}/{{.BUILD_DIR}}/_artifacts/{{.GITVERSION_MAJORMINORPATCH}}/godot/bundles/timeline.pck'

  bundle:activity:build:
    desc: Build the App.Ui.Activity bundle assembly and stage its DLL into the bundle source dir
    cmds:
      - dotnet build project/plugins/App.Ui.Activity/App.Ui.Activity.csproj -c Debug -v q -nologo
      - cp project/plugins/App.Ui.Activity/bin/Debug/net8.0/FantaSim.App.Ui.Activity.dll project/bundles/activity/FantaSim.App.Ui.Activity.dll

  bundle:activity:
    desc: Build the activity ledger UI bundle DLL/data + export the collectible activity bundle PCK (manifest + dll, no scene)
    deps: [bundle:link, bundle:activity:build, artifacts:latest]
    cmds:
      - mkdir -p {{.BUILD_DIR}}/_artifacts/{{.GITVERSION_MAJORMINORPATCH}}/godot/bundles
      - '{{.GODOT}} --headless --path {{.CONTENT_PROJECT}} --export-pack "activity PCK" {{.ROOT_DIR}}/{{.BUILD_DIR}}/_artifacts/{{.GITVERSION_MAJORMINORPATCH}}/godot/bundles/activity.pck'

  bundle:activity:data:
    desc: Re-export the activity ledger UI bundle PCK from staged DLL + current presentation data
    deps: [bundle:link, artifacts:latest]
    cmds:
      - mkdir -p {{.BUILD_DIR}}/_artifacts/{{.GITVERSION_MAJORMINORPATCH}}/godot/bundles
      - '{{.GODOT}} --headless --path {{.CONTENT_PROJECT}} --export-pack "activity PCK" {{.ROOT_DIR}}/{{.BUILD_DIR}}/_artifacts/{{.GITVERSION_MAJORMINORPATCH}}/godot/bundles/activity.pck'

  bundle:world:build:
    desc: Build the App.World data-bundle assemblies and stage their DLLs into the bundle source dir
    cmds:
      - dotnet build project/plugins/App.World/App.World.csproj -c Debug -v q -nologo
      - dotnet build project/plugins/App.World.Composition/App.World.Composition.csproj -c Debug -v q -nologo
      - dotnet build project/plugins/App.World.FieldView/App.World.FieldView.csproj -c Debug -v q -nologo
      - cp project/plugins/App.World/bin/Debug/net8.0/FantaSim.App.World.dll project/bundles/world/FantaSim.App.World.dll
      - cp project/plugins/App.World.Composition/bin/Debug/net8.0/FantaSim.App.World.Composition.dll project/bundles/world/FantaSim.App.World.Composition.dll
      - cp project/plugins/App.World.FieldView/bin/Debug/net8.0/FantaSim.App.World.FieldView.dll project/bundles/world/FantaSim.App.World.FieldView.dll

  bundle:world:
    desc: Build the world data-bundle DLLs + export the collectible world bundle PCK (manifest + dlls, no scene)
    deps: [bundle:link, bundle:world:build, artifacts:latest]
    cmds:
      - mkdir -p {{.BUILD_DIR}}/_artifacts/{{.GITVERSION_MAJORMINORPATCH}}/godot/bundles
      - '{{.GODOT}} --headless --path {{.CONTENT_PROJECT}} --export-pack "world PCK" {{.ROOT_DIR}}/{{.BUILD_DIR}}/_artifacts/{{.GITVERSION_MAJORMINORPATCH}}/godot/bundles/world.pck'

  bundles:
    desc: Export all collectible bundle PCKs (stage + assist + timeline + activity + world)
    deps: [bundle:stage, bundle:assist, bundle:timeline, bundle:activity, bundle:world]

  bundle:install:
    desc: Copy exported bundle PCKs next to the exported app exe so the windowed app resolves them
    deps: [artifacts:latest]
    vars:
      MACOS: '{{.BUILD_DIR}}/_artifacts/{{.GITVERSION_MAJORMINORPATCH}}/godot/osx/{{.ASSEMBLY}}.app/Contents/MacOS'
      PCKS: '{{.BUILD_DIR}}/_artifacts/{{.GITVERSION_MAJORMINORPATCH}}/godot/bundles'
    cmds:
      - mkdir -p "{{.MACOS}}/bundles"
      - cp "{{.PCKS}}/stage.pck" "{{.MACOS}}/bundles/stage.pck"
      - cp "{{.PCKS}}/assist.pck" "{{.MACOS}}/bundles/assist.pck"
      - cp "{{.PCKS}}/timeline.pck" "{{.MACOS}}/bundles/timeline.pck"
      - cp "{{.PCKS}}/activity.pck" "{{.MACOS}}/bundles/activity.pck"
      - cp "{{.PCKS}}/world.pck" "{{.MACOS}}/bundles/world.pck"

  run:exported:
    desc: Launch the exported WINDOWED app (with console) so bundle load is observable; never headless
    cmds:
      - '"{{.BUILD_DIR}}/_artifacts/{{.GITVERSION_MAJORMINORPATCH}}/godot/osx/{{.ASSEMBLY}}.app/Contents/MacOS/{{.ASSEMBLY}}"'

  # --- Rust (cargo): iii gdext bridge ---------------------------------------
  bridge:build:
    desc: Build the gdext iii bridge (debug) and stage it into res://bin/gdext/iii for the complete-app
    cmds:
      - cargo build --manifest-path project/Cargo.toml -p iii-bridge
      - cp project/target/debug/libiii_bridge.dylib project/hosts/complete-app/bin/gdext/iii/libiii_bridge.dylib

  # --- iii workers (Python: ComfyUI + Blender text->3D pipeline + VPLanet) --
  workers:setup:
    desc: Create the Python iii-worker venv and install iii-sdk
    cmds:
      - python3 -m venv project/workers/.venv
      - project/workers/.venv/bin/pip install -q -r project/workers/requirements.txt

  iii:engine:
    desc: Run the iii orchestration engine (workers connect on ws://127.0.0.1:49134)
    cmds:
      - iii --use-default-config --no-update-check

  workers:vplanet:test:
    desc: Run VPLanet worker contract tests without requiring iii or a VPLanet install
    cmds:
      - PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s project/workers/vplanet-worker -p 'test_*.py'

  external-tools:vplanet:codegen:
    desc: Generate VPLanet iii external-tool DTOs from JSON Schema into GeneratedOut
    vars:
      OUT_DIR: '{{.OUT_DIR | default "project/contracts/App.NodeGraph/ExternalTools/GeneratedOut/vplanet"}}'
    cmds:
      - dotnet run --project project/tools/App.ExternalTools.CodeGen/App.ExternalTools.CodeGen.csproj -- --tool vplanet --schema-dir project/contracts/App.NodeGraph/ExternalTools/Schemas/vplanet --out-dir "{{.OUT_DIR}}"

  workers:vplanet:run:
    desc: 'Run only the VPLanet iii worker (engine must be up; VPLANET_BIN optional)'
    vars:
      PY: project/workers/.venv/bin/python
    cmds:
      - '{{.PY}} project/workers/vplanet-worker/worker.py'

  workers:vplanet:smoke:
    desc: 'Live smoke VPLanet iii functions build -> run -> parse (engine and worker must be up)'
    vars:
      JOB_ID: '{{.JOB_ID | default "vplanet-live-smoke"}}'
      SYSTEM_NAME: '{{.SYSTEM_NAME | default "solar_system"}}'
      STAR_BODY: '{{.STAR_BODY | default "sun"}}'
      PLANET_BODY: '{{.PLANET_BODY | default "earth"}}'
      STOP_TIME_YEARS: '{{.STOP_TIME_YEARS | default "1000000"}}'
      OUTPUT_TIME_YEARS: '{{.OUTPUT_TIME_YEARS | default "100000"}}'
    cmds:
      - |
        set -eu
        build_payload="$(mktemp)"
        build_json="$(mktemp)"
        run_payload="$(mktemp)"
        run_json="$(mktemp)"
        parse_payload="$(mktemp)"
        parse_json="$(mktemp)"
        trap 'rm -f "$build_payload" "$build_json" "$run_payload" "$run_json" "$parse_payload" "$parse_json"' EXIT

        JOB_ID='{{.JOB_ID}}' \
        SYSTEM_NAME='{{.SYSTEM_NAME}}' \
        STAR_BODY='{{.STAR_BODY}}' \
        PLANET_BODY='{{.PLANET_BODY}}' \
        STOP_TIME_YEARS='{{.STOP_TIME_YEARS}}' \
        OUTPUT_TIME_YEARS='{{.OUTPUT_TIME_YEARS}}' \
        python3 - <<'PY' "$build_payload"
        import json, os, sys

        json.dump({
            "job_id": os.environ["JOB_ID"],
            "systemName": os.environ["SYSTEM_NAME"],
            "starBodyName": os.environ["STAR_BODY"],
            "planetBodyName": os.environ["PLANET_BODY"],
            "stopTimeYears": float(os.environ["STOP_TIME_YEARS"]),
            "outputTimeYears": float(os.environ["OUTPUT_TIME_YEARS"]),
        }, open(sys.argv[1], "w", encoding="utf-8"))
        PY

        iii trigger vplanet.input.build --json "$(cat "$build_payload")" --timeout-ms 30000 > "$build_json"
        python3 - <<'PY' "$build_json" "$run_payload"
        import json, sys

        build = json.load(open(sys.argv[1], encoding="utf-8"))
        json.dump({
            "job_id": build["job_id"],
            "inputBundle": build["inputBundle"],
        }, open(sys.argv[2], "w", encoding="utf-8"))
        PY

        iii trigger vplanet.run --json "$(cat "$run_payload")" --timeout-ms 30000 > "$run_json"
        python3 - <<'PY' "$run_json" "$parse_payload" '{{.PLANET_BODY}}'
        import json, sys

        run = json.load(open(sys.argv[1], encoding="utf-8"))
        json.dump({
            "job_id": run["job_id"],
            "runResult": run["runResult"],
            "bodyName": sys.argv[3],
        }, open(sys.argv[2], "w", encoding="utf-8"))
        PY

        iii trigger vplanet.output.parse --json "$(cat "$parse_payload")" --timeout-ms 30000 > "$parse_json"
        python3 - <<'PY' "$build_json" "$run_json" "$parse_json"
        import json, sys

        build = json.load(open(sys.argv[1], encoding="utf-8"))
        run = json.load(open(sys.argv[2], encoding="utf-8"))
        parsed = json.load(open(sys.argv[3], encoding="utf-8"))
        run_result = run["runResult"]
        table = parsed["outputTable"]
        print("job_id", build["job_id"])
        print("rootPath", build["inputBundle"]["rootPath"])
        print("fallback", run_result["fallback"])
        print("returnCode", run_result["returnCode"])
        print("bodyName", table["bodyName"])
        print("columns", ",".join(table["columns"]))
        print("rowCount", len(table["rows"]))
        PY

  workers:run:
    desc: 'Run comfy + blender + pipeline + VPLanet iii workers (engine must be up; text->3D needs ComfyUI @ :8188 + Blender)'
    vars:
      PY: project/workers/.venv/bin/python
    cmds:
      - '{{.PY}} project/workers/comfy-worker/worker.py &'
      - '{{.PY}} project/workers/blender-worker/worker.py &'
      - '{{.PY}} project/workers/pipeline-worker/worker.py &'
      - '{{.PY}} project/workers/vplanet-worker/worker.py &'
      - wait

  pipeline:test:
    desc: 'Fire the text->3D pipeline through iii (pass PROMPT=..., default a red cube)'
    vars:
      PROMPT: '{{.PROMPT | default "a small red toy cube"}}'
    cmds:
      - iii trigger pipeline.text_to_3d --json '{"prompt":"{{.PROMPT}}"}' --timeout-ms 300000

  artifacts:
    desc: List exported artifacts under build/_artifacts/<version>/godot/
    cmds:
      - ls -la {{.BUILD_DIR}}/_artifacts/{{.GITVERSION_MAJORMINORPATCH}}/godot/

  changelog:
    desc: Generate CHANGELOG.md from conventional commits
    cmds:
      - git-cliff -o CHANGELOG.md

  changelog:unreleased:
    desc: Print the unreleased changelog section to stdout
    cmds:
      - git-cliff --unreleased

  repomix:
    desc: Pack the repo into a single file for LLM context
    cmds:
      - repomix

  clean:
    desc: Remove build artifacts and Godot temp files
    cmds:
      - rm -rf {{.BUILD_DIR}}/_artifacts
      - rm -rf {{.GODOT_PROJECT}}/.godot/mono {{.CONTENT_PROJECT}}/.godot/mono
      - rm -rf {{.GODOT_PROJECT}}/bin {{.GODOT_PROJECT}}/obj
      - rm -rf {{.CONTENT_PROJECT}}/bundles

  hooks:install:
    desc: Install pre-commit hooks into .git
    cmds:
      - pre-commit install --install-hooks -t commit-msg -t pre-commit

  hooks:run:
    desc: Run pre-commit on all files
    cmds:
      - pre-commit run --all-files

  verify:
    desc: Build solution + run tests + export app + export stage bundle
    cmds:
      - task build
      - task test
      - task build:godot:desktop
      - task bundle:stage
      - task artifacts
