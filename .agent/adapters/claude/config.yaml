# Claude Code adapter for fantasim-app-godot.
# Synced by the workspace engine at <workspace>/.agent/scripts/. From the workspace root:
#   python .agent/scripts/sync.py --tool claude           # rule sync -> CLAUDE.md (@AGENTS.md pointer)
#   python .agent/scripts/sync-project.py --project yokan-projects/fantasim-app-godot
#       skill sync -> .claude/skills junctions; preserves the generated CLAUDE.md.

tool: claude
display_name: Claude Code

# No `rules` block here: CLAUDE.md is a hand-written `@AGENTS.md` pointer (AGENTS.md is the
# generated source of truth via the codex adapter). sync-project.py preserves CLAUDE.md
# because it lacks the "Generated by sync-project.py" marker — so it is never clobbered.

skills:
  target: .claude/skills
  # Project-local skills (resolved from this repo's .agent/skills/):
  local:
    - 04-tooling/verify-windowed
  # Shared workspace skills (resolved from <workspace>/.agent/skills/) — add as needed, e.g.:
  # workspace:
  #   - 05-process/doubt-driven-development
