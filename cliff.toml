# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog\n\n
All notable changes to this project are documented in this file.\n
The format is based on [Conventional Commits](https://www.conventionalcommits.org)
and generated by [git-cliff](https://github.com/orhun/git-cliff).\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}\
            **({{commit.scope}})** \
        {% endif %}\
        {{ commit.message | upper_first }}\
        {% if commit.breaking %}\
            {% raw %} {% endraw %}\
            ⚠️ BREAKING\
        {% endif %}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = """
{% for release in releases %}\
    {% if release.previous %}\
        {% set diff = release.version | split(pat=".") | last | int - release.previous.version | split(pat=".") | last | int %}\
    {% endif %}\
{% endfor %}\
"""
postprocessors = [
  { pattern = ">$", replace = "" },
]

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Testing" },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^chore\\(release\\): prepare for", skip = true },
  { message = "^chore|^ci", group = "Miscellaneous Tasks" },
  { body = ".*security", group = "Security" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
limit_commits = 42

[remote.github]
owner = ""
repo = ""
